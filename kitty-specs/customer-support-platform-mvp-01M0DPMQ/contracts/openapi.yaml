        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MacroCreateRequest'
      responses:
        '201':
          description: Macro created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Macro'

  /audit:
    get:
      tags: [Audit]
      summary: Query audit log
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: eventType
          in: query
          schema:
            type: string
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: string
            format: uuid
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated audit log
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
                  pagination:
                    $ref: '#/components/schemas/PaginatedResponse/properties/pagination'

  /webhooks/email:
    post:
      tags: [Webhooks]
      summary: Email provider webhook (Postmark)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailWebhookPayload'
      responses:
        '200':
          description: Webhook processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [processed, created_case, attached_to_case, duplicate]

  /realtime/stream:
    get:
      tags: [Real-time]
      summary: Server-Sent Events stream
      security:
        - BearerAuth: []
      parameters:
        - name: channels
          in: query
          description: Comma-separated channel names (cases, queues, notifications)
          schema:
            type: string
            default: "cases,queues,notifications"
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SSEEvent'
        '401':
          description: Unauthorized

  /health:
    get:
      tags: [System]
      summary: Health check
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded, down]
                  timestamp:
                    type: string
                    format: date-time
                  checks:
                    type: object
                    properties:
                      database:
                        type: object
                        properties:
                          status:
                            type: string
                      redis:
                        type: object
                        properties:
                          status:
                            type: string
                      storage:
                        type: object
                        properties:
                          status:
                            type: string

parameters:
  PageParam:
    name: page
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  LimitParam:
    name: limit
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  SortParam:
    name: sort
    in: query
    schema:
      type: string
  SearchParam:
    name: search
    in: query
    schema:
      type: string